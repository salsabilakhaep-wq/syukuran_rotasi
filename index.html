<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Syukuran Rotasi XXVI</title>
<meta property="og:title" content="Undangan Syukuran Rotasi XXVI">
<meta property="og:description" content="7 – 8 November 2026 · Pondok Uya, Pantai Anging Mamiri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#140700;--bg2:#3a1500;--or:#ff7a00;--or2:#ff9a2e;--cream:#ffe9d6;--line:rgba(255,154,46,.25)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 1rem/1.6 Poppins,system-ui,sans-serif;color:var(--cream);background:var(--bg);overflow-x:hidden}
.grid{background:
 radial-gradient(ellipse 70% 45% at 50% 38%,rgba(255,122,0,.55),transparent 70%),
 linear-gradient(var(--line) 1px,transparent 1px) 0 0/44px 44px,
 linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/44px 44px,
 linear-gradient(180deg,var(--bg2),var(--bg))}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* hero */
.hero{position:relative;text-align:center;padding:64px 0 90px;overflow:hidden}
.logo{position:relative;width:84px;height:84px;margin:0 auto 26px;border-radius:22px;background:linear-gradient(160deg,#ff9a2e,#d95a00);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font:800 .85rem Poppins;letter-spacing:.08em;color:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.tamu{display:inline-block;margin-bottom:18px;padding:7px 18px;border:1px solid var(--or2);border-radius:999px;font-size:.95rem}
.tamu b{color:var(--or2)}
.big{font:400 clamp(2.5rem,11.5vw,7rem)/.9 "Archivo Black",Impact,sans-serif;letter-spacing:-.02em;margin:0;text-transform:uppercase;background:linear-gradient(180deg,var(--or) 0%,#ffb86b 38%,#fff 75%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 7px 0 #4a1a00)}
.big span{display:block}
.sub{margin:22px auto 0;max-width:34ch;color:#ffd9b8}

/* hp + bubble */
.frame{position:relative;width:min(560px,100%);margin:68px auto 0;transform:rotate(-2.5deg)}
.pic{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;border:3px solid rgba(255,255,255,.65);background:linear-gradient(160deg,#4a1a00,#1a0a02);box-shadow:0 30px 60px -20px #000,0 0 80px rgba(255,122,0,.3)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#ffb86b;font-size:.9rem}
.bub{position:absolute;font:800 .95rem/1.15 Poppins;text-transform:uppercase;text-align:left;padding:16px 20px;border-radius:26px;box-shadow:0 12px 24px -10px #000;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.bub.w{background:#fff;color:var(--or);left:-14px;top:-32px;border-bottom-left-radius:4px;font-size:1.15rem;max-width:64%}
.bub.o{background:var(--or);color:#fff;right:-14px;bottom:-34px;border-bottom-right-radius:4px;max-width:68%;animation-delay:.35s}
.bub small{display:block;margin-top:4px;font:600 .72rem Poppins;opacity:.95}
@media(max-width:420px){.bub{padding:12px 15px}.bub.w{font-size:.95rem;left:-8px}.bub.o{right:-8px}}
@keyframes pop{from{transform:scale(.4) translateY(20px);opacity:0}}

/* sparkle */
.sp{position:absolute;width:var(--s,46px);height:var(--s,46px);background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 12px #fff);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.55) rotate(25deg);opacity:.6}}

/* countdown */
.count{display:flex;justify-content:center;gap:10px;margin-top:80px;flex-wrap:wrap}
.count div{min-width:76px;padding:12px 10px;border:1px solid var(--or2);border-radius:16px;background:rgba(255,122,0,.12);backdrop-filter:blur(4px)}
.count b{display:block;font:400 2rem "Archivo Black",sans-serif;color:var(--or2)}
.count span{font-size:.78rem;color:#ffd9b8}

/* konten */
.s{padding:68px 0}
.s h2{font:400 clamp(1.9rem,6vw,3rem)/1 "Archivo Black",Impact,sans-serif;text-transform:uppercase;margin:0 0 28px;color:var(--or2)}
.cards{display:grid;gap:16px}
@media(min-width:760px){.cards{grid-template-columns:1fr 1fr}}
.cd{padding:26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(255,122,0,.16),rgba(255,122,0,.03))}
.cd small{color:var(--or2);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.cd p{margin:6px 0 0;font:800 1.4rem/1.25 Poppins}
.cd span{color:#ffd9b8;font-size:.95rem}
.days{display:grid;gap:18px;max-width:640px}
.day h3{margin:0 0 12px;font:800 1.15rem Poppins;color:#fff;padding:8px 16px;background:var(--or);border-radius:999px;display:inline-block}
.day ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--or)}
.day li{padding:0 0 16px 18px;position:relative}
.day li::before{content:"";position:absolute;left:-8px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--or2)}
.day time{color:var(--or2);font-weight:600}
.day p{margin:0}
.btn{display:inline-block;margin:14px 10px 0 0;padding:14px 26px;border-radius:999px;font:600 1rem Poppins;text-decoration:none;color:#fff;background:var(--or);border:2px solid var(--or)}
.btn:hover{background:#ff8f26}
.btn.ghost{background:transparent;border-color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.rsvp{padding:38px 26px;border-radius:26px;text-align:center;background:linear-gradient(160deg,#ff7a00,#c44a00);color:#fff}
.rsvp h2{color:#fff}
.rsvp p{max-width:44ch;margin:0 auto}
.rsvp .btn{background:#fff;color:#c44a00;border-color:#fff}
.rsvp .btn.ghost{background:transparent;color:#fff}
footer{padding:36px 0 56px;text-align:center;color:#ffd9b8;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body class="grid">

<header class="hero">
  <i class="sp" style="top:6%;right:8%"></i>
  <i class="sp" style="top:30%;left:-14px;--s:60px;animation-delay:1s"></i>
  <i class="sp" style="bottom:12%;right:4%;--s:38px;animation-delay:.5s"></i>
  <div class="wrap">
    <div class="logo" id="logo"><img src="img/logo.png" alt="Logo" onerror="this.remove();document.getElementById('logo').append('ROTASI')"></div>
    <div class="tamu">Kepada Yth. <b id="tamu">Teman-teman</b></div>
    <h1 class="big"><span>Syukuran</span><span>Rotasi</span></h1>
    <p class="sub" id="sub"></p>

    <div class="frame">
      <div class="pic">
        <span class="ph">Taruh foto di img/foto.jpg</span>
        <img src="img/foto.jpg" alt="Foto kebersamaan Rotasi" onerror="this.remove()">
      </div>
      <div class="bub w" id="bub1"></div>
      <div class="bub o"><span id="bub2a"></span><small id="bub2b"></small></div>
    </div>

    <div class="count" id="count"></div>
  </div>
</header>

<main class="wrap">
  <section class="s" id="info">
    <h2>Detail acara</h2>
    <div class="cards">
      <div class="cd"><small>Tanggal</small><p id="tgl"></p><span id="jam"></span></div>
      <div class="cd"><small>Lokasi</small><p id="tempat"></p><span id="alamat"></span><br>
        <a class="btn" id="maps" target="_blank" rel="noopener">Buka Google Maps</a></div>
    </div>
  </section>

  <section class="s" id="rundown">
    <h2>Rangkaian acara</h2>
    <div class="days" id="days"></div>
  </section>

  <section class="s" id="bawa">
    <h2>Perlu dibawa</h2>
    <p id="bawaTxt" style="max-width:60ch"></p>
  </section>

  <section class="s" id="rsvp">
    <div class="rsvp">
      <h2>Konfirmasi kehadiran</h2>
      <p>Isi konfirmasi supaya panitia bisa menyiapkan semuanya dengan baik.</p>
      <a class="btn" id="rsvpLink" target="_blank" rel="noopener">Isi konfirmasi</a>
      <a class="btn ghost" id="waLink" target="_blank" rel="noopener">Hubungi panitia</a>
    </div>
  </section>
</main>

<footer>Sampai jumpa di <span id="foot"></span></footer>

<script>
/* ====== UBAH DATA ACARA DI SINI SAJA ====== */
const CONFIG = {
  acara: "Syukuran Rotasi XXVI",
  tagline: "Satu keluarga, satu rotasi. Yuk rayakan bersama dua hari penuh cerita.",
  mulai: "2026-11-07T08:00:00+08:00",      // jam mulai (WITA), dipakai hitung mundur
  tanggalLabel: "7 – 8 November 2026",
  jamLabel: "Jam mulai: 08.00 WITA",
  tempat: "Pondok Uya, Pantai Anging Mamiri",
  alamat: "Lengkapi alamat di sini",
  mapsUrl: "https://www.google.com/maps/search/?api=1&query=Pondok+Uya+Pantai+Anging+Mamiri",
  rsvpUrl: "https://forms.gle/GANTI-DENGAN-LINK-FORM-KAMU",
  waNomor: "6281234567890",                // awali 62, tanpa + atau 0
  bawa: "Pakaian ganti, perlengkapan mandi, dan kabar baik. Detail lain akan diinfokan panitia.",
  rundown: [  // CONTOH, ganti sesuai rencana panitia
    { hari: "Sabtu, 7 Nov", item: [
      ["08.00", "Kumpul dan registrasi", "Ambil name tag dan cek kehadiran."],
      ["10.00", "Pembukaan", "Sambutan dan doa bersama."],
      ["19.00", "Malam kebersamaan", "Makan malam dan penampilan."] ] }
  ]
};
/* ========================================= */

const $ = id => document.getElementById(id);
const nama = (new URLSearchParams(location.search).get("to") || "").trim().slice(0, 60);
if (nama) $("tamu").textContent = nama;

document.title = "Undangan " + CONFIG.acara;
$("sub").textContent = CONFIG.tagline;
$("bub1").textContent = CONFIG.acara;
$("bub2a").textContent = CONFIG.tanggalLabel;
$("bub2b").textContent = CONFIG.tempat;
$("tgl").textContent = CONFIG.tanggalLabel;
$("jam").textContent = CONFIG.jamLabel;
$("tempat").textContent = CONFIG.tempat;
$("alamat").textContent = CONFIG.alamat;
$("maps").href = CONFIG.mapsUrl;
$("bawaTxt").textContent = CONFIG.bawa;
$("rsvpLink").href = CONFIG.rsvpUrl;
$("waLink").href = "https://wa.me/" + CONFIG.waNomor + "?text=" + encodeURIComponent("Halo panitia, saya " + (nama || "") + " mau tanya soal " + CONFIG.acara);
$("foot").textContent = CONFIG.acara + ".";

CONFIG.rundown.forEach(d => {
  const box = document.createElement("div"); box.className = "day";
  const h = document.createElement("h3"); h.textContent = d.hari;
  const ul = document.createElement("ul");
  d.item.forEach(([j, t, k]) => {
    const li = document.createElement("li");
    const tm = document.createElement("time"), b = document.createElement("b"), p = document.createElement("p");
    tm.textContent = j + " WITA"; b.textContent = t; p.textContent = k;
    const wrap = document.createElement("div"); wrap.append(tm, document.createElement("br"), b, p);
    li.append(wrap); ul.appendChild(li);
  });
  box.append(h, ul); $("days").appendChild(box);
});

const target = new Date(CONFIG.mulai);
function tick() {
  const s = Math.max(0, Math.floor((target - new Date()) / 1000));
  const v = [["hari", Math.floor(s / 86400)], ["jam", Math.floor(s % 86400 / 3600)], ["menit", Math.floor(s % 3600 / 60)], ["detik", s % 60]];
  $("count").innerHTML = v.map(([l, n]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
